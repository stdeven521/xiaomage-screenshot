name: Personal macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-macos-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      VCPKG_MAX_CONCURRENCY: '2'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.tools/vcpkg-binaries,readwrite'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode 26 toolchain
        run: |
          xcode_path="$(python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = []
          for app in Path('/Applications').glob('Xcode_26*.app'):
              match = re.fullmatch(r'Xcode_(26\.\d+(?:\.\d+)?)\.app', app.name)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), app))
          if not candidates:
              raise SystemExit('An installed stable Xcode 26 toolchain is required')
          print(max(candidates)[1] / 'Contents/Developer')
          PY
          )"
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version
          # CMake 4 defaults to an empty sysroot. An explicit SDK also prevents
          # /usr/bin clang from preferring Intel Homebrew headers in /usr/local.
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Restore Qt kit
        uses: actions/cache@v4
        with:
          path: ~/Qt/6.12.0
          key: personal-macos-qt-6.12.0-v2
      - name: Restore native dependencies
        uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: .tools/vcpkg-binaries
          key: personal-macos-${{ matrix.arch }}-xcode26-vcpkg-${{ hashFiles('vcpkg*.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            personal-macos-${{ matrix.arch }}-xcode26-vcpkg-${{ hashFiles('vcpkg*.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}-
            personal-macos-${{ matrix.arch }}-xcode26-vcpkg-
      - name: Install build tools and Qt
        run: |
          brew install ninja pkgconf nasm autoconf automake libtool clang-format
          python3 -m venv .tools/ci-python
          .tools/ci-python/bin/pip install 'cmake==4.2.3' aqtinstall
          echo "$GITHUB_WORKSPACE/.tools/ci-python/bin" >> "$GITHUB_PATH"
          if [[ ! -f "$HOME/Qt/6.12.0/macos/lib/cmake/Qt6/Qt6Config.cmake" ||
                ! -f "$HOME/Qt/6.12.0/macos/lib/QtQml.framework/Versions/A/QtQml" ]]; then
            .tools/ci-python/bin/python -m aqt install-qt mac desktop 6.12.0 clang_64 \
              --outputdir "$HOME/Qt" --archives qtbase qtdeclarative qtsvg qttools qttranslations
          fi
          # Qt's official lrelease links QtQml even for our Widgets-only app.
          "$HOME/Qt/6.12.0/macos/bin/lrelease" -version
          echo "Qt6_DIR=$HOME/Qt/6.12.0/macos/lib/cmake/Qt6" >> "$GITHUB_ENV"
          mkdir -p .tools/vcpkg-binaries
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Prepare Metal compiler
        if: matrix.arch == 'arm64'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Collect matching Qt license metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/collect-personal-qt-licenses.py --qt-prefix "$HOME/Qt/6.12.0/macos"
      - name: Bootstrap full native dependencies
        run: bash scripts/bootstrap-macos.sh snow-shot-macos-${{ matrix.arch }}-performance
      - name: Save native dependency cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/vcpkg-binaries
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify OCR bootstrap ordering
        run: |
          python3 scripts/test-macos-build-support.py \
            MacOSBuildScripts.test_bootstrap_prepares_ocr_before_installing_dependencies \
            MacOSBuildScripts.test_bootstrap_stops_on_ocr_patch_conflict
      - name: Verify isolated native headers
        run: |
          dependency_include="$GITHUB_WORKSPACE/.tools/macos/installed/dynamic/${{ matrix.arch }}-osx-snow-shot/include"
          header_trace="$RUNNER_TEMP/personal-macos-headers.log"
          printf '#include <webp/decode.h>\n#include <webp/demux.h>\n#include <webp/encode.h>\n#include <webp/mux.h>\n' | \
            /usr/bin/c++ -isysroot "$SDKROOT" -isystem "$dependency_include" \
              -E -H -x c++ - >/dev/null 2>"$header_trace"
          cat "$header_trace"
          if grep -E '/usr/local/include/|/opt/homebrew/include/' "$header_trace"; then
            echo 'Unexpected Homebrew headers in the isolated build.' >&2
            exit 1
          fi
          for header in decode.h demux.h encode.h mux.h; do
            grep -F "$dependency_include/webp/$header" "$header_trace" >/dev/null
          done
      - name: Identify Cargo cache toolchains
        id: cargo-cache-key
        env:
          CACHE_ARCH: ${{ matrix.arch }}
          CACHE_RUNNER: ${{ matrix.runner }}
          CACHE_LOCKS: ${{ hashFiles('snow_rust_ffi/Cargo.lock', 'snow-crates/Cargo.lock', 'snow_draw_engine_qt/Cargo.lock', 'snow-image-rs/Cargo.lock', 'snow_shot/rust/snow-shot-mcp/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/Cargo.lock') }}
          CACHE_NATIVE_CONFIG: ${{ hashFiles('vcpkg*.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'cmake/RustStaticLibrary.cmake', 'cmake/SnowOcrToolchain.cmake', 'snow_shot/CMakeLists.txt', 'cmake/SnowDiagnostics.cmake') }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          pin = Path('snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml').read_text()
          channel = re.search(r'^channel\s*=\s*"([^"]+)"', pin, re.MULTILINE)[1]
          identity = {
              'xcode': output('xcodebuild', '-version'),
              'sdk': output('xcrun', '--sdk', 'macosx', '--show-sdk-build-version'),
              'rust': output('rustc', '-vV'),
              'ocr_channel': channel,
              'ocr_rust': output('rustup', 'run', channel, 'rustc', '-vV'),
              'workspace': os.environ['GITHUB_WORKSPACE'],
              'deployment_target': os.environ['MACOSX_DEPLOYMENT_TARGET'],
              'native_config': os.environ['CACHE_NATIVE_CONFIG'],
          }
          toolchains = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          # Keep source/Metal fixes out of this prefix. Cargo rechecks their own
          # fingerprints while unchanged third-party builds remain reusable.
          prefix = (f"personal-cargo-build-v1-{os.environ['CACHE_ARCH']}-"
                    f"{os.environ['CACHE_RUNNER']}-performance-release-fast-"
                    f"{toolchains}-{os.environ['CACHE_LOCKS']}-")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write(f'build-prefix={prefix}\n')
          print(f'Cargo cache: {os.environ["CACHE_ARCH"]}, performance/release-fast, {channel}, {toolchains[:16]}')
          PY
      - name: Restore Cargo downloads
        id: cargo-download-cache
        uses: actions/cache/restore@v4
        with:
          # Never cache Cargo credentials, config, executables or unpacked sources.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: personal-cargo-downloads-v1-${{ matrix.arch }}-${{ hashFiles('snow_rust_ffi/Cargo.lock', 'snow-crates/Cargo.lock', 'snow_draw_engine_qt/Cargo.lock', 'snow-image-rs/Cargo.lock', 'snow_shot/rust/snow-shot-mcp/Cargo.lock', 'snow-crates/crates/simd-paddle-ocr-rs/Cargo.lock') }}
      - name: Restore Cargo build outputs
        id: cargo-build-cache
        uses: actions/cache/restore@v4
        with:
          # This contains the base and full target trees, not Qt/vcpkg/C++ outputs.
          # Keep dSYMs paired with fresh fingerprints for symbol packaging.
          path: build/snow-shot-macos-${{ matrix.arch }}-performance/cargo
          key: ${{ steps.cargo-cache-key.outputs.build-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cargo-cache-key.outputs.build-prefix }}
      - name: Verify Metal build module
        if: matrix.arch == 'arm64'
        run: python3 scripts/check-personal-macos-metal.py
      - name: Build full personal edition and targeted tests
        id: build-personal
        run: |
          bash scripts/build.sh snow-shot-macos-${{ matrix.arch }}-performance --parallel 2 \
            --target snow_shot \
            --target snow-shot-application-storage-tests \
            --target snow-shot-configuration-archive-tests \
            --target snow-shot-application-icon-tests \
            --target snow-shot-about-page-tests \
            --target snow-shot-text-translation-tests \
            --target snow-shot-translation-service-tests \
            --target snow-shot-update-adapter-tests -- \
            -DSNOW_APPS_BUILD_TESTS=ON \
            -DSNOW_APPS_BUILD_BENCHMARKS=OFF \
            -DSNOW_APPS_BUILD_SNOW_SHOT_MINI=OFF \
            -DSNOW_APPS_PACKAGE_SNOW_SHOT=ON \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DSNOW_RUST_RELEASE_PROFILE=release-fast \
            -DSNOW_MACOS_CODESIGN_IDENTITY=-
      - name: Inspect completed Cargo cache content
        id: cargo-cache-state
        if: always() && (steps.build-personal.outcome == 'success' || steps.build-personal.outcome == 'failure')
        env:
          CACHE_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          workspace = Path.cwd().resolve()
          expected = workspace / f'build/snow-shot-macos-{os.environ["CACHE_ARCH"]}-performance/cargo'
          target = expected.resolve()
          if target != expected or not target.is_relative_to(workspace / 'build'):
              raise SystemExit('Unexpected Cargo cache directory')
          compiled = False
          total = 0
          for root, directories, files in os.walk(target):
              if 'incremental' in directories:
                  incremental = Path(root) / 'incremental'
                  if incremental.is_symlink() or not incremental.resolve().is_relative_to(target):
                      raise SystemExit('Unexpected incremental cache directory')
                  # Prune only generated compiler databases after Cargo exits.
                  # Negated child globs cannot exclude tar's parent recursion.
                  shutil.rmtree(incremental)
                  directories.remove('incremental')
              for name in files:
                  path = Path(root) / name
                  if path.is_file():
                      size = path.stat().st_size
                      total += size
                      compiled |= size > 0 and path.suffix in ('.rlib', '.rmeta', '.a', '.dylib')
          cargo_home = Path.home() / '.cargo'
          downloads = any(path.is_file() for directory in ('registry/index', 'registry/cache', 'git/db')
                          for path in (cargo_home / directory).rglob('*'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write(f'build={str(compiled).lower()}\ndownloads={str(downloads).lower()}\n')
          print(f'Cargo outputs eligible for caching: {total / 1024**2:.1f} MiB; compiled artifacts: {compiled}')
          PY
      - name: Save Cargo downloads after build
        if: always() && steps.cargo-cache-state.outputs.downloads == 'true' && steps.cargo-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-download-cache.outputs.cache-primary-key }}
      - name: Save Cargo build outputs after build
        if: always() && steps.cargo-cache-state.outputs.build == 'true' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/snow-shot-macos-${{ matrix.arch }}-performance/cargo
          key: ${{ steps.cargo-build-cache.outputs.cache-primary-key }}
      - name: Verify personal edition behavior
        run: |
          ctest --test-dir build/snow-shot-macos-${{ matrix.arch }}-performance \
            --output-on-failure --no-tests=error \
            -R '^snow-shot-(application-storage|configuration-archive|application-icon|about-page|text-translation)-tests$'
          build_dir="build/snow-shot-macos-${{ matrix.arch }}-performance"
          "$(find "$build_dir" -type f -name snow-shot-translation-service-tests)" --local-models-only -platform offscreen
          "$(find "$build_dir" -type f -name snow-shot-update-adapter-tests)" --personal-update-policy-only -platform offscreen
      - name: Package and verify DMG
        run: bash scripts/package-personal-macos.sh '${{ matrix.arch }}'
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: xiaomage-macos-${{ matrix.arch }}
          path: dist/personal-macos/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-diagnostics
          path: |
            build/snow-shot-macos-${{ matrix.arch }}-performance/CMakeCache.txt
            build/snow-shot-macos-${{ matrix.arch }}-performance/CMakeFiles/CMakeConfigureLog.yaml
            build/snow-shot-macos-${{ matrix.arch }}-performance/Testing/Temporary/LastTest.log
            build/snow-shot-macos-${{ matrix.arch }}-performance/macos-ocr-verification.json
            build/snow-shot-macos-${{ matrix.arch }}-performance/cargo/**/build/*/output
            build/snow-shot-macos-${{ matrix.arch }}-performance/cargo/**/build/*/stderr
            build/snow-shot-macos-${{ matrix.arch }}-performance/cargo/**/.fingerprint/*/output-*
            .tools/personal-metal-check/*.log
            .tools/personal-metal-check/result.json
          include-hidden-files: true
          if-no-files-found: ignore
